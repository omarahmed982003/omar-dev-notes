<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quantity check</title>
</head>
<body>
<script>
let price = 10;
let quantity = 3;
if (quantity < 0) {
  document.body.textContent = "Invalid quantity";
} else {
  document.body.textContent = price * quantity;
}
</script>
</body>
</html>
