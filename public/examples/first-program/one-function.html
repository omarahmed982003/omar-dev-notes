<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One function</title>
<pre id="output"></pre>
<script>
function double(number) {
  return number * 2;
}
document.querySelector("#output").textContent = double(7);
</script>
