<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2720" viewBox="0 0 1200 2720" role="img" aria-labelledby="ttl dsc"><title id="ttl">رحلة الطلب من المتصفح إلى تطبيق PHP</title><desc id="dsc">مسار الطلب، اختصارات التخزين المؤقت، ورجوع الاستجابة</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f3efff"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="sh"><feDropShadow dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#059669"/></marker><style>text{font-family:"Segoe UI","Noto Sans Arabic",Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700;fill:#fff}.hs{font-size:18px;fill:#e0e7ff}.t{font-size:26px;font-weight:700}.d{font-size:18px;font-weight:600}.s{font-size:15px}.n{filter:url(#sh)}.rq{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;marker-end:url(#ab)}.rs{fill:none;stroke:#059669;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ag)}.br{fill:none;stroke:#059669;stroke-width:6;stroke-dasharray:12 9}</style></defs><rect width="1200" height="2720" rx="36" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="156" rx="28" fill="url(#hero)"/>
<text class="h" x="600" y="92" text-anchor="middle" direction="rtl">رحلة الطلب من المتصفح إلى تطبيق PHP</text>
<text class="hs" x="600" y="132" text-anchor="middle" direction="rtl">مسار الطلب، اختصارات التخزين المؤقت، ورجوع الاستجابة</text>
<g transform="translate(250 166)"><line x2="52" stroke="#2563eb" stroke-width="7"/><text class="s" x="65" y="5" text-anchor="start" direction="rtl">مسار الطلب</text><line x1="300" x2="352" stroke="#059669" stroke-width="7"/><text class="s" x="365" y="5" text-anchor="start" direction="rtl">الاستجابة / Cache Hit</text><line x1="620" x2="672" stroke="#f97316" stroke-width="5" stroke-dasharray="9 7"/><text class="s" x="685" y="5" text-anchor="start" direction="rtl">طبقة اختيارية</text></g>
<path class="rq" d="M600 420V505M600 765V845M600 1085V1165M600 1385V1485M600 1700V1815M600 2085V2175M600 2410V2485"/>
<g class="n"><rect x="250" y="230" width="700" height="190" rx="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text class="t" x="600" y="286" text-anchor="middle" direction="rtl">١. المتصفح</text><text class="d" x="600" y="333" text-anchor="middle" direction="rtl">تحليل URL • فحص Cache • بناء HTTP Request</text><text class="s" x="600" y="373" text-anchor="middle" direction="rtl">Headers • Cookies • Body اختياري</text></g><path class="br" d="M250 325H100V2190"/><rect x="22" y="448" width="225" height="64" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="s" x="134" y="486" text-anchor="middle" direction="rtl">Browser Cache صالح؟ عرض فوري</text>
<g class="n"><rect x="210" y="520" width="780" height="245" rx="26" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text class="t" x="600" y="570" text-anchor="middle" direction="rtl">٢. البحث في DNS</text><text class="d" x="600" y="610" text-anchor="middle" direction="rtl">تحويل النطاق إلى IP</text><rect x="240" y="646" width="215" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="347.5" y="677" text-anchor="middle" direction="rtl">Browser / OS Cache</text><text class="s" x="347.5" y="707" text-anchor="middle" direction="rtl">Cache</text><text class="d" x="480" y="694" text-anchor="middle" direction="rtl">→</text><rect x="495" y="646" width="210" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="677" text-anchor="middle" direction="rtl">Recursive Resolver</text><text class="s" x="600" y="707" text-anchor="middle" direction="rtl"></text><text class="d" x="725" y="694" text-anchor="middle" direction="rtl">→</text><rect x="745" y="646" width="215" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="852.5" y="677" text-anchor="middle" direction="rtl">Root → TLD → Authoritative</text><text class="s" x="852.5" y="707" text-anchor="middle" direction="rtl"></text><text class="s" x="600" y="742" text-anchor="middle" direction="rtl">IP + TTL</text></g>
<g class="n"><rect x="210" y="860" width="780" height="225" rx="26" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/><text class="t" x="600" y="912" text-anchor="middle" direction="rtl">٣. إنشاء الاتصال</text><rect x="250" y="956" width="330" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="415" y="987" text-anchor="middle" direction="rtl">HTTP/1.1 و HTTP/2</text><text class="s" x="415" y="1017" text-anchor="middle" direction="rtl">TCP Handshake ثم TLS عند HTTPS</text><rect x="620" y="956" width="330" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="785" y="987" text-anchor="middle" direction="rtl">HTTP/3</text><text class="s" x="785" y="1017" text-anchor="middle" direction="rtl">QUIC فوق UDP</text></g>
<g class="n"><rect x="80" y="1180" width="1040" height="205" rx="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text class="t" x="600" y="1226" text-anchor="middle" direction="rtl">٤ - ٧. عبور الشبكة</text><rect x="105" y="1260" width="225" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="217.5" y="1291" text-anchor="middle" direction="rtl">NIC</text><text class="s" x="217.5" y="1321" text-anchor="middle" direction="rtl">Ethernet / Wi-Fi</text><text class="d" x="350" y="1311" text-anchor="middle" direction="rtl">→</text><rect x="380" y="1260" width="195" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="477.5" y="1291" text-anchor="middle" direction="rtl">Router</text><text class="s" x="477.5" y="1321" text-anchor="middle" direction="rtl">Forwarding + NAT</text><text class="d" x="595" y="1311" text-anchor="middle" direction="rtl">→</text><rect x="625" y="1260" width="190" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="720" y="1291" text-anchor="middle" direction="rtl">ISP</text><text class="s" x="720" y="1321" text-anchor="middle" direction="rtl">ربط بالإنترنت</text><text class="d" x="835" y="1311" text-anchor="middle" direction="rtl">→</text><rect x="865" y="1260" width="230" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="980" y="1291" text-anchor="middle" direction="rtl">Internet</text><text class="s" x="980" y="1321" text-anchor="middle" direction="rtl">عدة Routers</text></g>
<g class="n"><rect x="180" y="1500" width="840" height="200" rx="26" fill="#ffedd5" stroke="#f97316" stroke-width="3" stroke-dasharray="12 8"/><text class="t" x="600" y="1548" text-anchor="middle" direction="rtl">٨. طبقات اختيارية</text><rect x="215" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="330" y="1621" text-anchor="middle" direction="rtl">CDN</text><text class="s" x="330" y="1651" text-anchor="middle" direction="rtl">Cache قريب</text><rect x="485" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="1621" text-anchor="middle" direction="rtl">WAF</text><text class="s" x="600" y="1651" text-anchor="middle" direction="rtl">فلترة الحماية</text><rect x="755" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="870" y="1621" text-anchor="middle" direction="rtl">Load Balancer</text><text class="s" x="870" y="1651" text-anchor="middle" direction="rtl">توزيع الحمل</text></g><path class="br" d="M180 1600H100"/>
<g class="n"><rect x="180" y="1830" width="840" height="255" rx="26" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/><text class="t" x="600" y="1880" text-anchor="middle" direction="rtl">٩. Web Server / Reverse Proxy</text><text class="s" x="600" y="1918" text-anchor="middle" direction="rtl">Nginx أو Apache • Host / Virtual Host</text><rect x="230" y="1950" width="320" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="390" y="1981" text-anchor="middle" direction="rtl">ملف ثابت</text><text class="s" x="390" y="2011" text-anchor="middle" direction="rtl">HTML • CSS • JS • Images</text><rect x="650" y="1950" width="320" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="810" y="1981" text-anchor="middle" direction="rtl">طلب ديناميكي</text><text class="s" x="810" y="2011" text-anchor="middle" direction="rtl">PHP-FPM</text><text class="s" x="600" y="2070" text-anchor="middle" direction="rtl">Nginx لا ينفذ PHP بنفسه</text></g><path class="br" d="M230 1995H100"/>
<g class="n"><rect x="210" y="2190" width="780" height="220" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text class="t" x="600" y="2248" text-anchor="middle" direction="rtl">١٠. تطبيق PHP</text><text class="d" x="600" y="2300" text-anchor="middle" direction="rtl">Validation → Authentication → Authorization</text><text class="s" x="600" y="2350" text-anchor="middle" direction="rtl">Business Logic → بناء HTTP Response</text></g>
<g class="n"><rect x="125" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="270" y="2531" text-anchor="middle" direction="rtl">Cache</text><text class="s" x="270" y="2561" text-anchor="middle" direction="rtl">Redis / Memory</text><rect x="455" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="2531" text-anchor="middle" direction="rtl">Database</text><text class="s" x="600" y="2561" text-anchor="middle" direction="rtl">MySQL / PostgreSQL</text><rect x="785" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="930" y="2531" text-anchor="middle" direction="rtl">خدمات خارجية</text><text class="s" x="930" y="2561" text-anchor="middle" direction="rtl">APIs / Queues / Email</text></g><path d="M600 2410V2465H270V2500M600 2465V2500M600 2465H930V2500" fill="none" stroke="#16a34a" stroke-width="5"/>
<path class="rs" d="M210 2300H100V330H235"/><rect x="18" y="1035" width="220" height="135" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="d" x="128" y="1074" text-anchor="middle" direction="rtl">استجابة HTTP</text><text class="s" x="128" y="1110" text-anchor="middle" direction="rtl">Status • Headers • Body</text><text class="s" x="128" y="1145" text-anchor="middle" direction="rtl">ترجع عبر المسار العكسي</text><rect x="270" y="443" width="660" height="48" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="s" x="600" y="474" text-anchor="middle" direction="rtl">المتصفح يخزن الاستجابة إن سُمح ثم يعرض النتيجة</text><rect x="250" y="2640" width="700" height="52" rx="26" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/><text class="s" x="600" y="2673" text-anchor="middle" direction="rtl">قد تختصر Browser Cache أو CDN الرحلة، وقد يعاد استخدام اتصال مفتوح.</text></svg>
