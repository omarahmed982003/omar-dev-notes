<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2720" viewBox="0 0 1200 2720" role="img" aria-labelledby="ttl dsc"><title id="ttl">From Browser Request to a PHP Application</title><desc id="dsc">The request path, cache shortcuts, and the returning response</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f3efff"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="sh"><feDropShadow dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#059669"/></marker><style>text{font-family:"Segoe UI","Noto Sans Arabic",Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700;fill:#fff}.hs{font-size:18px;fill:#e0e7ff}.t{font-size:26px;font-weight:700}.d{font-size:18px;font-weight:600}.s{font-size:15px}.n{filter:url(#sh)}.rq{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;marker-end:url(#ab)}.rs{fill:none;stroke:#059669;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ag)}.br{fill:none;stroke:#059669;stroke-width:6;stroke-dasharray:12 9}</style></defs><rect width="1200" height="2720" rx="36" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="156" rx="28" fill="url(#hero)"/>
<text class="h" x="600" y="92" text-anchor="middle">From Browser Request to a PHP Application</text>
<text class="hs" x="600" y="132" text-anchor="middle">The request path, cache shortcuts, and the returning response</text>
<g transform="translate(250 166)"><line x2="52" stroke="#2563eb" stroke-width="7"/><text class="s" x="65" y="5" text-anchor="start">Request path</text><line x1="300" x2="352" stroke="#059669" stroke-width="7"/><text class="s" x="365" y="5" text-anchor="start">Response / cache hit</text><line x1="620" x2="672" stroke="#f97316" stroke-width="5" stroke-dasharray="9 7"/><text class="s" x="685" y="5" text-anchor="start">Optional layer</text></g>
<path class="rq" d="M600 420V505M600 765V845M600 1085V1165M600 1385V1485M600 1700V1815M600 2085V2175M600 2410V2485"/>
<g class="n"><rect x="250" y="230" width="700" height="190" rx="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text class="t" x="600" y="286" text-anchor="middle">1. Browser</text><text class="d" x="600" y="333" text-anchor="middle">Parse URL • check cache • build HTTP request</text><text class="s" x="600" y="373" text-anchor="middle">Headers • Cookies • optional Body</text></g><path class="br" d="M250 325H100V2190"/><rect x="22" y="448" width="225" height="64" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="s" x="134" y="486" text-anchor="middle">Fresh browser cache? Render immediately</text>
<g class="n"><rect x="210" y="520" width="780" height="245" rx="26" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text class="t" x="600" y="570" text-anchor="middle">2. DNS lookup</text><text class="d" x="600" y="610" text-anchor="middle">Translate the domain into an IP</text><rect x="240" y="646" width="215" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="347.5" y="677" text-anchor="middle">Browser / OS cache</text><text class="s" x="347.5" y="707" text-anchor="middle">Cache</text><text class="d" x="480" y="694" text-anchor="middle">→</text><rect x="495" y="646" width="210" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="677" text-anchor="middle">Recursive resolver</text><text class="s" x="600" y="707" text-anchor="middle"></text><text class="d" x="725" y="694" text-anchor="middle">→</text><rect x="745" y="646" width="215" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="852.5" y="677" text-anchor="middle">Root → TLD → Authoritative</text><text class="s" x="852.5" y="707" text-anchor="middle"></text><text class="s" x="600" y="742" text-anchor="middle">IP + TTL</text></g>
<g class="n"><rect x="210" y="860" width="780" height="225" rx="26" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/><text class="t" x="600" y="912" text-anchor="middle">3. Establish the connection</text><rect x="250" y="956" width="330" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="415" y="987" text-anchor="middle">HTTP/1.1 and HTTP/2</text><text class="s" x="415" y="1017" text-anchor="middle">TCP handshake then TLS for HTTPS</text><rect x="620" y="956" width="330" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="785" y="987" text-anchor="middle">HTTP/3</text><text class="s" x="785" y="1017" text-anchor="middle">QUIC over UDP</text></g>
<g class="n"><rect x="80" y="1180" width="1040" height="205" rx="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text class="t" x="600" y="1226" text-anchor="middle">4 - 7. Cross the network</text><rect x="105" y="1260" width="225" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="217.5" y="1291" text-anchor="middle">NIC</text><text class="s" x="217.5" y="1321" text-anchor="middle">Ethernet / Wi-Fi</text><text class="d" x="350" y="1311" text-anchor="middle">→</text><rect x="380" y="1260" width="195" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="477.5" y="1291" text-anchor="middle">Router</text><text class="s" x="477.5" y="1321" text-anchor="middle">Forwarding + NAT</text><text class="d" x="595" y="1311" text-anchor="middle">→</text><rect x="625" y="1260" width="190" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="720" y="1291" text-anchor="middle">ISP</text><text class="s" x="720" y="1321" text-anchor="middle">Internet access</text><text class="d" x="835" y="1311" text-anchor="middle">→</text><rect x="865" y="1260" width="230" height="82" rx="26" fill="#fffaf0" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="980" y="1291" text-anchor="middle">Internet</text><text class="s" x="980" y="1321" text-anchor="middle">Multiple routers</text></g>
<g class="n"><rect x="180" y="1500" width="840" height="200" rx="26" fill="#ffedd5" stroke="#f97316" stroke-width="3" stroke-dasharray="12 8"/><text class="t" x="600" y="1548" text-anchor="middle">8. Optional edge layers</text><rect x="215" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="330" y="1621" text-anchor="middle">CDN</text><text class="s" x="330" y="1651" text-anchor="middle">Nearby cache</text><rect x="485" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="1621" text-anchor="middle">WAF</text><text class="s" x="600" y="1651" text-anchor="middle">Security filtering</text><rect x="755" y="1590" width="230" height="82" rx="26" fill="#fff7ed" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="870" y="1621" text-anchor="middle">Load balancer</text><text class="s" x="870" y="1651" text-anchor="middle">Distribute traffic</text></g><path class="br" d="M180 1600H100"/>
<g class="n"><rect x="180" y="1830" width="840" height="255" rx="26" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/><text class="t" x="600" y="1880" text-anchor="middle">9. Web server / reverse proxy</text><text class="s" x="600" y="1918" text-anchor="middle">Nginx or Apache • Host / virtual host</text><rect x="230" y="1950" width="320" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="390" y="1981" text-anchor="middle">Static file</text><text class="s" x="390" y="2011" text-anchor="middle">HTML • CSS • JS • images</text><rect x="650" y="1950" width="320" height="82" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="810" y="1981" text-anchor="middle">Dynamic request</text><text class="s" x="810" y="2011" text-anchor="middle">PHP-FPM</text><text class="s" x="600" y="2070" text-anchor="middle">Nginx does not execute PHP itself</text></g><path class="br" d="M230 1995H100"/>
<g class="n"><rect x="210" y="2190" width="780" height="220" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text class="t" x="600" y="2248" text-anchor="middle">10. PHP application</text><text class="d" x="600" y="2300" text-anchor="middle">Validation → Authentication → Authorization</text><text class="s" x="600" y="2350" text-anchor="middle">Business logic → build HTTP response</text></g>
<g class="n"><rect x="125" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="270" y="2531" text-anchor="middle">Cache</text><text class="s" x="270" y="2561" text-anchor="middle">Redis / memory</text><rect x="455" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="600" y="2531" text-anchor="middle">Database</text><text class="s" x="600" y="2561" text-anchor="middle">MySQL / PostgreSQL</text><rect x="785" y="2500" width="290" height="82" rx="26" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="3"/><text class="d" x="930" y="2531" text-anchor="middle">External services</text><text class="s" x="930" y="2561" text-anchor="middle">APIs / queues / email</text></g><path d="M600 2410V2465H270V2500M600 2465V2500M600 2465H930V2500" fill="none" stroke="#16a34a" stroke-width="5"/>
<path class="rs" d="M210 2300H100V330H235"/><rect x="18" y="1035" width="220" height="135" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="d" x="128" y="1074" text-anchor="middle">HTTP response</text><text class="s" x="128" y="1110" text-anchor="middle">Status • Headers • Body</text><text class="s" x="128" y="1145" text-anchor="middle">Returns through the reverse path</text><rect x="270" y="443" width="660" height="48" rx="26" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text class="s" x="600" y="474" text-anchor="middle">The browser may cache the response, then renders the result</text><rect x="250" y="2640" width="700" height="52" rx="26" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/><text class="s" x="600" y="2673" text-anchor="middle">Browser cache or a CDN can shorten the journey, and an open connection can be reused.</text></svg>
