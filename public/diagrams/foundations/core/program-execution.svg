<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" role="img" aria-labelledby="t d">
<title id="t">From source code to a running process</title><desc id="d">Source code is read by a runtime, loaded with dependencies, becomes a process, and asks the operating system for resources.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#93c5fd"/></marker></defs><rect width="360" height="680" rx="26" fill="url(#bg)"/>
<text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Source code is not a running program</text>
<g font-family="Arial" text-anchor="middle">
<rect x="52" y="74" width="256" height="72" rx="17" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="106" fill="#e0e7ff" font-size="16" font-weight="700">Source file</text><text x="180" y="129" fill="#cbd5e1" font-size="13">app.php · readable instructions</text>
<rect x="52" y="184" width="256" height="82" rx="17" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="180" y="216" fill="#bae6fd" font-size="16" font-weight="700">PHP runtime</text><text x="180" y="240" fill="#cbd5e1" font-size="13">parse · compile internally · execute</text>
<rect x="52" y="306" width="256" height="82" rx="17" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/><text x="180" y="338" fill="#99f6e4" font-size="16" font-weight="700">Dependencies loaded</text><text x="180" y="362" fill="#cbd5e1" font-size="13">libraries · configuration · extensions</text>
<rect x="52" y="428" width="256" height="82" rx="17" fill="#451a03" stroke="#fb923c" stroke-width="2"/><text x="180" y="460" fill="#fed7aa" font-size="16" font-weight="700">Running process</text><text x="180" y="484" fill="#cbd5e1" font-size="13">PID · memory · open files</text>
<rect x="52" y="550" width="256" height="72" rx="17" fill="#3f0713" stroke="#fb7185" stroke-width="2"/><text x="180" y="582" fill="#fecdd3" font-size="16" font-weight="700">Operating System</text><text x="180" y="605" fill="#cbd5e1" font-size="13">CPU time · network · storage</text>
</g><g fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#a)"><path d="M180 146v29"/><path d="M180 266v31"/><path d="M180 388v31"/><path d="M180 510v31"/></g>
</svg>
