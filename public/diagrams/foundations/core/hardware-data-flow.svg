<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" role="img" aria-labelledby="t d">
<title id="t">Hardware data flow</title><desc id="d">Input travels through the operating system into RAM, the CPU processes it, and results go to output or persistent storage.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="700" rx="26" fill="url(#bg)"/>
<text x="180" y="42" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="19" font-weight="700">From input to a saved result</text>
<g font-family="Arial" text-anchor="middle" filter="url(#s)">
<rect x="58" y="72" width="244" height="74" rx="18" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="180" y="104" fill="#7dd3fc" font-size="16" font-weight="700">Input device</text><text x="180" y="127" fill="#cbd5e1" font-size="13">keyboard · network · disk</text>
<rect x="58" y="190" width="244" height="74" rx="18" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="180" y="222" fill="#c7d2fe" font-size="16" font-weight="700">Operating System</text><text x="180" y="245" fill="#cbd5e1" font-size="13">driver · process · permissions</text>
<rect x="28" y="312" width="132" height="88" rx="18" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/><text x="94" y="345" fill="#99f6e4" font-size="16" font-weight="700">RAM</text><text x="94" y="368" fill="#cbd5e1" font-size="12">active code</text><text x="94" y="385" fill="#cbd5e1" font-size="12">and data</text>
<rect x="200" y="312" width="132" height="88" rx="18" fill="#451a03" stroke="#fb923c" stroke-width="2"/><text x="266" y="345" fill="#fed7aa" font-size="16" font-weight="700">CPU</text><text x="266" y="368" fill="#cbd5e1" font-size="12">fetch · decode</text><text x="266" y="385" fill="#cbd5e1" font-size="12">execute</text>
<rect x="28" y="492" width="132" height="88" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="94" y="525" fill="#e9d5ff" font-size="16" font-weight="700">Output</text><text x="94" y="549" fill="#cbd5e1" font-size="12">screen · response</text>
<rect x="200" y="492" width="132" height="88" rx="18" fill="#3f0713" stroke="#fb7185" stroke-width="2"/><text x="266" y="525" fill="#fecdd3" font-size="16" font-weight="700">Storage</text><text x="266" y="549" fill="#cbd5e1" font-size="12">files · database</text>
</g>
<g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"><path d="M180 146v36"/><path d="M180 264v28L94 306"/><path d="M160 356h27"/><path d="M266 400v38L94 480"/><path d="M266 400v80"/></g>
<path d="M200 372H173" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#a)"/><text x="180" y="647" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">RAM is working space. Storage keeps bytes after power-off.</text>
</svg>
