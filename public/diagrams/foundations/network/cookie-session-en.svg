<svg xmlns="http://www.w3.org/2000/svg" width="360" height="765" viewBox="0 0 360 765" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Two requests, one session</title><desc id="desc">The response sets an identifier, the next request returns it, and the server updates the counter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<style>text{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.link{fill:none;stroke-width:3}</style>
<rect width="360" height="765" rx="12" fill="#f8fafc"/>
<rect x="15" y="20" width="130" height="60" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><rect x="215" y="20" width="130" height="60" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="80" y="57" font-size="23" direction="ltr" fill="#172554"><tspan x="80" dy="0" direction="ltr" unicode-bidi="isolate">Browser</tspan></text><text x="280" y="57" font-size="22" direction="ltr" fill="#172554"><tspan x="280" dy="0" direction="ltr" unicode-bidi="isolate">PHP server</tspan></text><path d="M80 85V625M280 85V625" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><text x="180" y="124" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">1. First request</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">No session identifier</tspan></text><path d="M80 178H277" class="edge"/><text x="180" y="230" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">2. Store the identifier</tspan></text><text x="180" y="263" font-size="21" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Set-Cookie:</tspan></text><text x="180" y="291" font-size="21" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">FOUNDATIONSLAB=…</tspan></text><path d="M280 315H83" class="edge"/><text x="180" y="374" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">3. Second request</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">Same identifier</tspan></text><text x="180" y="440" font-size="21" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Cookie:</tspan></text><text x="180" y="468" font-size="21" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">FOUNDATIONSLAB=…</tspan></text><path d="M80 492H277" class="edge"/><text x="180" y="550" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">4. Same session</tspan></text><text x="180" y="582" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">visits: 2</tspan></text><path d="M280 606H83" class="edge"/><rect x="20" y="650" width="320" height="92" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="685" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Data stays on the server</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">visits: 1 → 2</tspan></text>
</svg>
