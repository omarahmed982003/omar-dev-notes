<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" aria-labelledby="title desc" lang="en"><title id="title">TCP three-way handshake</title><desc id="desc">Client SYN, server SYN+ACK, then client ACK. The two directions have independent sequence spaces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><style>text{font:21px Tahoma,"Segoe UI",Arial,sans-serif;fill:#172554;text-anchor:middle;unicode-bidi:isolate}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}</style><rect width="360" height="550" rx="12" fill="#f8fafc"/><rect x="15" y="20" width="120" height="55" rx="9" fill="#dbeafe"/><rect x="225" y="20" width="120" height="55" rx="9" fill="#dbeafe"/><text x="75" y="55" direction="ltr">Client</text><text x="285" y="55" direction="ltr">Server</text><path d="M75 80V425M285 80V425" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><text x="180" y="120" direction="ltr">SYN, seq = 100</text><path d="M75 145H282" class="edge"/><text x="180" y="205" direction="ltr">SYN + ACK</text><text x="180" y="238" direction="ltr">seq = 700, ack = 101</text><path d="M285 265H78" class="edge"/><text x="180" y="330" direction="ltr">ACK, ack = 701</text><path d="M75 355H282" class="edge"/><rect x="20" y="435" width="320" height="90" rx="9" fill="#dcfce7"/><text x="180" y="470" direction="ltr">Application data can follow</text><text x="180" y="503" direction="ltr">Not user authentication</text></svg>
