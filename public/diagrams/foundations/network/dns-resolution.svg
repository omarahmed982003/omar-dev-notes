<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="t d">
<title id="t">DNS resolution on a cache miss</title><desc id="d">A browser asks a recursive resolver, which follows root, TLD, and authoritative referrals before caching the answer.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#082f49"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#67e8f9"/></marker></defs><rect width="360" height="760" rx="26" fill="url(#bg)"/>
<text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">DNS resolution — cache miss</text>
<g font-family="Arial" text-anchor="middle">
<rect x="52" y="72" width="256" height="64" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="111" fill="#e0e7ff" font-size="16" font-weight="700">Browser / OS cache</text>
<rect x="52" y="174" width="256" height="72" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="180" y="204" fill="#cffafe" font-size="16" font-weight="700">Recursive resolver</text><text x="180" y="227" fill="#cbd5e1" font-size="13">asks on the client's behalf</text>
<rect x="52" y="294" width="256" height="64" rx="16" fill="#3b0764" stroke="#d8b4fe" stroke-width="2"/><text x="180" y="333" fill="#f3e8ff" font-size="16" font-weight="700">Root servers</text>
<rect x="52" y="406" width="256" height="64" rx="16" fill="#451a03" stroke="#fdba74" stroke-width="2"/><text x="180" y="445" fill="#ffedd5" font-size="16" font-weight="700">TLD servers — .com</text>
<rect x="52" y="518" width="256" height="74" rx="16" fill="#052e2b" stroke="#5eead4" stroke-width="2"/><text x="180" y="549" fill="#ccfbf1" font-size="16" font-weight="700">Authoritative server</text><text x="180" y="573" fill="#cbd5e1" font-size="13">owns example.com records</text>
<rect x="52" y="642" width="256" height="72" rx="16" fill="#3f0713" stroke="#fda4af" stroke-width="2"/><text x="180" y="672" fill="#ffe4e6" font-size="16" font-weight="700">Answer + TTL</text><text x="180" y="696" fill="#cbd5e1" font-size="13">cache, then return to client</text>
</g><g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"><path d="M180 136v29"/><path d="M180 246v39"/><path d="M180 358v39"/><path d="M180 470v39"/><path d="M180 592v41"/></g>
</svg>
