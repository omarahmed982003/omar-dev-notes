<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 730" role="img" aria-labelledby="t d">
<title id="t">Three mechanisms for large HTTP bodies</title><desc id="d">Range requests select part of a download, multipart separates upload fields and files, and streaming produces a response progressively while protocol framing carries it.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#082f49"/></linearGradient></defs><rect width="360" height="730" rx="26" fill="url(#bg)"/><text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Large HTTP bodies — choose by need</text><g font-family="Arial"><g transform="translate(26 76)"><rect width="308" height="166" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="22" y="34" fill="#bfdbfe" font-size="16" font-weight="700">Range request · download part</text><rect x="22" y="63" width="264" height="30" rx="8" fill="#1e293b"/><rect x="88" y="63" width="82" height="30" rx="8" fill="#3b82f6"/><text x="22" y="122" fill="#cbd5e1" font-size="12">Range: bytes=1000-1999</text><text x="22" y="145" fill="#93c5fd" font-size="12">206 Partial Content</text></g><g transform="translate(26 270)"><rect width="308" height="174" rx="20" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/><text x="22" y="34" fill="#99f6e4" font-size="16" font-weight="700">Multipart · upload parts</text><rect x="22" y="62" width="264" height="31" rx="8" fill="#134e4a"/><text x="35" y="83" fill="#ccfbf1" font-size="12">title = avatar</text><rect x="22" y="103" width="264" height="44" rx="8" fill="#115e59"/><text x="35" y="130" fill="#ccfbf1" font-size="12">photo = binary bytes</text><text x="22" y="163" fill="#5eead4" font-size="11">boundary separates each part</text></g><g transform="translate(26 472)"><rect width="308" height="178" rx="20" fill="#451a03" stroke="#fb923c" stroke-width="2"/><text x="22" y="34" fill="#fed7aa" font-size="16" font-weight="700">Streaming · produce progressively</text><g transform="translate(22 64)"><rect width="70" height="38" rx="9" fill="#9a3412"/><rect x="82" width="70" height="38" rx="9" fill="#c2410c"/><rect x="164" width="70" height="38" rx="9" fill="#ea580c"/><rect x="246" width="40" height="38" rx="9" fill="#f97316"/></g><text x="22" y="130" fill="#cbd5e1" font-size="12">application stream ≠ HTTP/1.1 chunk syntax</text><text x="22" y="153" fill="#fdba74" font-size="12">HTTP/2 and HTTP/3 use protocol frames</text></g></g><text x="180" y="690" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Do not buffer an entire body unless the operation needs it.</text></svg>
