<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 710" role="img" aria-labelledby="t d">
<title id="t">TCP detects loss and retransmits bytes</title><desc id="d">A sender transmits segments, one is lost, acknowledgements reveal the gap, and the missing bytes are retransmitted before ordered delivery.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#60a5fa"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#34d399"/></marker></defs><rect width="360" height="710" rx="26" fill="url(#bg)"/>
<text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">TCP reliability is active work</text><g font-family="Arial"><text x="64" y="82" fill="#bfdbfe" font-size="16" font-weight="700">Sender</text><text x="266" y="82" fill="#a7f3d0" font-size="16" font-weight="700">Receiver</text></g><g stroke="#475569" stroke-width="2"><path d="M70 96v545"/><path d="M290 96v545"/></g>
<g font-family="Arial" font-size="13"><path d="M72 132L286 177" stroke="#60a5fa" stroke-width="3" marker-end="url(#b)"/><text x="142" y="139" fill="#bfdbfe">bytes 0–999</text><path d="M72 210L205 239" stroke="#fb7185" stroke-width="3"/><path d="M213 241l14 14m0-14l-14 14" stroke="#fb7185" stroke-width="3"/><text x="120" y="214" fill="#fecdd3">1000–1999 lost</text><path d="M72 292L286 337" stroke="#60a5fa" stroke-width="3" marker-end="url(#b)"/><text x="143" y="298" fill="#bfdbfe">bytes 2000–2999</text><path d="M288 379L74 424" stroke="#34d399" stroke-width="3" marker-end="url(#g)"/><text x="132" y="389" fill="#a7f3d0">ACK: next 1000</text><path d="M72 470L286 515" stroke="#fbbf24" stroke-width="3" marker-end="url(#b)"/><text x="125" y="475" fill="#fde68a">retransmit 1000–1999</text><path d="M288 558L74 603" stroke="#34d399" stroke-width="3" marker-end="url(#g)"/><text x="139" y="568" fill="#a7f3d0">ACK: next 3000</text></g><text x="180" y="676" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">The application receives an ordered byte stream.</text>
</svg>
