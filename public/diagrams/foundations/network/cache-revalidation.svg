<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" role="img" aria-labelledby="t d">
<title id="t">HTTP cache freshness and revalidation</title><desc id="d">A cache serves a fresh response directly, revalidates stale content with a validator, and stores a new response when modified.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#3b0764"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#c4b5fd"/></marker></defs><rect width="360" height="700" rx="26" fill="url(#bg)"/><text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">HTTP cache decision</text><g font-family="Arial" text-anchor="middle"><rect x="52" y="76" width="256" height="64" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="115" fill="#e0e7ff" font-size="16" font-weight="700">Request arrives</text><path d="M180 140v38" stroke="#c4b5fd" stroke-width="3" marker-end="url(#a)"/><polygon points="180,184 292,246 180,308 68,246" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="180" y="239" fill="#cffafe" font-size="15" font-weight="700">Cached response</text><text x="180" y="260" fill="#cffafe" font-size="15" font-weight="700">still fresh?</text><rect x="26" y="360" width="132" height="76" rx="16" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="92" y="393" fill="#a7f3d0" font-size="15" font-weight="700">YES</text><text x="92" y="416" fill="#cbd5e1" font-size="13">serve cache</text><rect x="202" y="360" width="132" height="76" rx="16" fill="#451a03" stroke="#fb923c" stroke-width="2"/><text x="268" y="393" fill="#fed7aa" font-size="15" font-weight="700">NO</text><text x="268" y="416" fill="#cbd5e1" font-size="13">revalidate</text><rect x="202" y="492" width="132" height="88" rx="16" fill="#3f0713" stroke="#fb7185" stroke-width="2"/><text x="268" y="522" fill="#fecdd3" font-size="14" font-weight="700">304</text><text x="268" y="543" fill="#cbd5e1" font-size="12">reuse body</text><text x="268" y="562" fill="#cbd5e1" font-size="12">update metadata</text><rect x="26" y="492" width="132" height="88" rx="16" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="92" y="522" fill="#bae6fd" font-size="14" font-weight="700">200</text><text x="92" y="543" fill="#cbd5e1" font-size="12">new body</text><text x="92" y="562" fill="#cbd5e1" font-size="12">replace cache</text></g><g fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#a)"><path d="M126 278L93 350"/><path d="M234 278l33 72"/><path d="M242 436l-99 48"/><path d="M268 436v46"/></g><text x="180" y="644" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Freshness avoids a request. Validation can avoid a body.</text>
</svg>
