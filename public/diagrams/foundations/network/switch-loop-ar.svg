<svg xmlns="http://www.w3.org/2000/svg" width="360" height="745" viewBox="0 0 360 745" role="img" aria-labelledby="title desc" lang="ar">
<title id="title">روابط احتياطية بلا حلقة فعالة</title><desc id="desc">مثال يفترض A جذرًا. بعد STP يعمل الرابطان A-B وA-C ويُمنع تمرير البيانات عبر المنفذ الزائد على رابط B-C.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<style>text{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.link{fill:none;stroke-width:3}</style>
<rect width="360" height="745" rx="12" fill="#f8fafc"/>
<text x="180" y="35" font-size="23" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">قبل: كل الروابط تمرّر</tspan></text><path d="M180 100L60 260H300Z" class="link" stroke="#b91c1c"/><circle cx="180" cy="100" r="28" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="180" y="108" font-size="26" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">A</tspan></text><circle cx="60" cy="260" r="28" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="60" y="268" font-size="26" direction="ltr" fill="#172554"><tspan x="60" dy="0" direction="ltr" unicode-bidi="isolate">B</tspan></text><circle cx="300" cy="260" r="28" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="300" y="268" font-size="26" direction="ltr" fill="#172554"><tspan x="300" dy="0" direction="ltr" unicode-bidi="isolate">C</tspan></text><text x="180" y="214" font-size="21" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">حلقة بث</tspan></text><text x="180" y="323" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">A → B → C → A</tspan></text><line x1="15" y1="360" x2="345" y2="360" stroke="#cbd5e1"/><text x="180" y="400" font-size="22" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">بعد: STP يمنع الحلقة</tspan></text><path d="M180 465L60 625M180 465L300 625" class="link" stroke="#15803d"/><path d="M88 625H272" class="link" stroke="#64748b" stroke-dasharray="8 7"/><path d="M167 612L193 638M193 612L167 638" stroke="#b91c1c" stroke-width="4"/><circle cx="180" cy="465" r="28" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="180" y="473" font-size="26" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">A</tspan></text><circle cx="60" cy="625" r="28" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="60" y="633" font-size="26" direction="ltr" fill="#172554"><tspan x="60" dy="0" direction="ltr" unicode-bidi="isolate">B</tspan></text><circle cx="300" cy="625" r="28" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="300" y="633" font-size="26" direction="ltr" fill="#172554"><tspan x="300" dy="0" direction="ltr" unicode-bidi="isolate">C</tspan></text><text x="180" y="695" font-size="22" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">الرابط B–C لسه موجود،</tspan><tspan x="180" dy="28" direction="rtl" unicode-bidi="isolate">بس مش بيمرّر بيانات هنا</tspan></text>
</svg>
