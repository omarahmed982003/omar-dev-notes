<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="t d">
<title id="t">VPC public and private boundaries</title><desc id="d">Internet traffic enters through a public load balancer, reaches private application instances, then a private database with narrowly scoped rules.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#60a5fa"/></marker></defs><rect width="360" height="760" rx="26" fill="url(#bg)"/><text x="180" y="39" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">VPC — layered network boundaries</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="66" width="160" height="58" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="101" fill="#e0e7ff" font-size="16" font-weight="700">Internet clients</text><rect x="24" y="160" width="312" height="162" rx="22" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="180" y="190" fill="#7dd3fc" font-size="14" font-weight="700">PUBLIC SUBNET</text><rect x="62" y="215" width="236" height="76" rx="17" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="180" y="247" fill="#cffafe" font-size="16" font-weight="700">WAF / Load Balancer</text><text x="180" y="271" fill="#cbd5e1" font-size="12">public entry · allowed ports only</text><rect x="24" y="354" width="312" height="162" rx="22" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/><text x="180" y="384" fill="#5eead4" font-size="14" font-weight="700">PRIVATE APP SUBNET</text><rect x="62" y="409" width="236" height="76" rx="17" fill="#134e4a" stroke="#34d399" stroke-width="2"/><text x="180" y="441" fill="#a7f3d0" font-size="16" font-weight="700">Application instances</text><text x="180" y="465" fill="#cbd5e1" font-size="12">no direct inbound Internet route</text><rect x="24" y="548" width="312" height="150" rx="22" fill="#3f0713" stroke="#fb7185" stroke-width="2"/><text x="180" y="578" fill="#fda4af" font-size="14" font-weight="700">DATA SUBNET</text><rect x="62" y="603" width="236" height="64" rx="17" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/><text x="180" y="642" fill="#fecdd3" font-size="16" font-weight="700">Database</text></g><g fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#a)"><path d="M180 124v80"/><path d="M180 291v107"/><path d="M180 485v107"/></g><g font-family="Arial" font-size="11" fill="#dbeafe"><text x="190" y="352">app port only</text><text x="190" y="546">database port only</text></g><text x="180" y="730" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Routing controls reachability. Rules control admission.</text>
</svg>
