<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="t d">
<title id="t">Simplified TLS 1.3 handshake</title><desc id="d">ClientHello and ServerHello establish parameters and shared keys, then the server proves identity and both sides exchange protected HTTP.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#052e2b"/></linearGradient><marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#22d3ee"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#a78bfa"/></marker></defs><rect width="360" height="720" rx="26" fill="url(#bg)"/><text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">TLS 1.3 — full handshake</text><text x="54" y="82" fill="#67e8f9" font-family="Arial" font-size="16" font-weight="700">Client</text><text x="258" y="82" fill="#c4b5fd" font-family="Arial" font-size="16" font-weight="700">Server</text><g stroke="#475569" stroke-width="2"><path d="M62 96v550"/><path d="M298 96v550"/></g><g font-family="Arial" font-size="12"><path d="M64 132L294 175" stroke="#22d3ee" stroke-width="3" marker-end="url(#c)"/><text x="115" y="137" fill="#cffafe">ClientHello + key share</text><path d="M296 212L66 255" stroke="#a78bfa" stroke-width="3" marker-end="url(#s)"/><text x="114" y="216" fill="#ede9fe">ServerHello + key share</text><rect x="93" y="282" width="174" height="46" rx="14" fill="#134e4a" stroke="#2dd4bf"/><text x="180" y="310" text-anchor="middle" fill="#ccfbf1">derive handshake keys</text><path d="M296 362L66 405" stroke="#a78bfa" stroke-width="3" marker-end="url(#s)"/><text x="107" y="353" fill="#ede9fe">Certificate · Verify · Finished</text><path d="M64 450L294 493" stroke="#22d3ee" stroke-width="3" marker-end="url(#c)"/><text x="148" y="454" fill="#cffafe">Finished</text><rect x="83" y="530" width="194" height="54" rx="16" fill="#164e63" stroke="#38bdf8"/><text x="180" y="553" text-anchor="middle" fill="#e0f2fe" font-weight="700">Protected HTTP</text><text x="180" y="572" text-anchor="middle" fill="#bae6fd">application traffic keys</text></g><text x="180" y="674" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Certificate proves identity; symmetric keys protect data.</text>
</svg>
