<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="t d">
<title id="t">Bottom-up network troubleshooting ladder</title><desc id="d">Troubleshooting proceeds through local configuration, DNS, route, port, TLS, and HTTP, keeping the first failed stage as the current boundary.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#3b0764"/></linearGradient></defs><rect width="360" height="720" rx="26" fill="url(#bg)"/><text x="180" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Troubleshoot bottom-up</text><g font-family="Arial">
<g transform="translate(28 78)"><rect width="304" height="72" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="22" y="31" fill="#bfdbfe" font-size="15" font-weight="700">1 · Local configuration</text><text x="22" y="54" fill="#cbd5e1" font-size="12">address · gateway · DNS server</text></g>
<g transform="translate(28 170)"><rect width="304" height="72" rx="16" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="22" y="31" fill="#bae6fd" font-size="15" font-weight="700">2 · DNS</text><text x="22" y="54" fill="#cbd5e1" font-size="12">name → expected address?</text></g>
<g transform="translate(28 262)"><rect width="304" height="72" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="22" y="31" fill="#cffafe" font-size="15" font-weight="700">3 · Route</text><text x="22" y="54" fill="#cbd5e1" font-size="12">is there a usable path?</text></g>
<g transform="translate(28 354)"><rect width="304" height="72" rx="16" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="22" y="31" fill="#a7f3d0" font-size="15" font-weight="700">4 · Port / listener</text><text x="22" y="54" fill="#cbd5e1" font-size="12">can the transport connect?</text></g>
<g transform="translate(28 446)"><rect width="304" height="72" rx="16" fill="#451a03" stroke="#fb923c" stroke-width="2"/><text x="22" y="31" fill="#fed7aa" font-size="15" font-weight="700">5 · TLS</text><text x="22" y="54" fill="#cbd5e1" font-size="12">name · certificate · negotiation</text></g>
<g transform="translate(28 538)"><rect width="304" height="72" rx="16" fill="#3f0713" stroke="#fb7185" stroke-width="2"/><text x="22" y="31" fill="#fecdd3" font-size="15" font-weight="700">6 · HTTP / application</text><text x="22" y="54" fill="#cbd5e1" font-size="12">status · headers · body · logs</text></g></g><text x="180" y="660" text-anchor="middle" fill="#e9d5ff" font-family="Arial" font-size="13">Stop guessing: keep the first failed stage as evidence.</text>
</svg>
