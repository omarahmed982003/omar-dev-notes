<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" aria-labelledby="title desc" lang="ar">
<title id="title">شجرة أكبر ثلاثة أعداد</title><desc id="desc">نقارن a مع b ثم الفائز مع c. كل سؤال له نعم ولا وكل نهاية تعيد أكبر قيمة.</desc>
