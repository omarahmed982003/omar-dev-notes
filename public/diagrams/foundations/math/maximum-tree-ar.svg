<style>text{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.link{fill:none;stroke-width:3}</style>
<rect width="360" height="500" rx="12" fill="#f8fafc"/>
<text x="180" y="28" font-size="22" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">اختار أكبر قيمة</tspan></text><path d="M180 47L245 92L180 137L115 92Z" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="100" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">a ≥ b?</tspan></text><path d="M115 92H85V185" class="edge"/><text x="55" y="155" font-size="22" direction="rtl" fill="#172554"><tspan x="55" dy="0" direction="rtl" unicode-bidi="isolate">نعم</tspan></text><path d="M245 92H275V185" class="edge"/><text x="305" y="155" font-size="22" direction="rtl" fill="#172554"><tspan x="305" dy="0" direction="rtl" unicode-bidi="isolate">لا</tspan></text><path d="M85 190L160 235L85 280L10 235Z" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="85" y="243" font-size="22" direction="ltr" fill="#172554"><tspan x="85" dy="0" direction="ltr" unicode-bidi="isolate">a ≥ c?</tspan></text><path d="M275 190L350 235L275 280L200 235Z" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="275" y="243" font-size="22" direction="ltr" fill="#172554"><tspan x="275" dy="0" direction="ltr" unicode-bidi="isolate">b ≥ c?</tspan></text><path d="M48 258L40 310V365" class="edge"/><text x="65" y="342" font-size="21" direction="rtl" fill="#172554"><tspan x="65" dy="0" direction="rtl" unicode-bidi="isolate">نعم</tspan></text><path d="M122 258L130 310V365" class="edge"/><text x="155" y="342" font-size="21" direction="rtl" fill="#172554"><tspan x="155" dy="0" direction="rtl" unicode-bidi="isolate">لا</tspan></text><path d="M238 258L230 310V365" class="edge"/><text x="205" y="342" font-size="21" direction="rtl" fill="#172554"><tspan x="205" dy="0" direction="rtl" unicode-bidi="isolate">نعم</tspan></text><path d="M312 258L320 310V365" class="edge"/><text x="295" y="342" font-size="21" direction="rtl" fill="#172554"><tspan x="295" dy="0" direction="rtl" unicode-bidi="isolate">لا</tspan></text><rect x="6" y="370" width="68" height="60" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="40" y="408" font-size="26" direction="ltr" fill="#172554"><tspan x="40" dy="0" direction="ltr" unicode-bidi="isolate">a</tspan></text><rect x="96" y="370" width="68" height="60" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="130" y="408" font-size="26" direction="ltr" fill="#172554"><tspan x="130" dy="0" direction="ltr" unicode-bidi="isolate">c</tspan></text><rect x="196" y="370" width="68" height="60" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="230" y="408" font-size="26" direction="ltr" fill="#172554"><tspan x="230" dy="0" direction="ltr" unicode-bidi="isolate">b</tspan></text><rect x="286" y="370" width="68" height="60" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="320" y="408" font-size="26" direction="ltr" fill="#172554"><tspan x="320" dy="0" direction="ltr" unicode-bidi="isolate">c</tspan></text><text x="180" y="477" font-size="20" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">كل نهاية ترجع القيمة المكتوبة</tspan></text>
