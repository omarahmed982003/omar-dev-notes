<svg xmlns="http://www.w3.org/2000/svg" width="360" height="745" viewBox="0 0 360 745" role="img" aria-labelledby="title desc" lang="ar">
<title id="title">الحلقة ترجع لفحص الشرط</title><desc id="desc">بعد الجمع والتحديث نرجع للشرط لا للبداية. فرع لا يخرج ويطبع المجموع.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<style>text{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.link{fill:none;stroke-width:3}</style>
<rect width="360" height="745" rx="12" fill="#f8fafc"/>
<rect x="65" y="15" width="230" height="70" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="180" y="44" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">sum = 0</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">i = 1</tspan></text><path d="M180 85V135" class="edge"/><path d="M180 140L280 225L180 310L80 225Z" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="234" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">i ≤ N?</tspan></text><path d="M180 310V365" class="edge"/><text x="215" y="345" font-size="22" direction="rtl" fill="#172554"><tspan x="215" dy="0" direction="rtl" unicode-bidi="isolate">نعم</tspan></text><rect x="65" y="370" width="230" height="65" rx="10" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/><text x="180" y="410" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">sum = sum + i</tspan></text><path d="M180 435V475" class="edge"/><rect x="65" y="480" width="230" height="65" rx="10" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/><text x="180" y="520" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">i = i + 1</tspan></text><path d="M295 512H335V115H180V135" class="edge"/><text x="180" y="590" font-size="21" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">ارجع للشرط، مش للبداية</tspan></text><path d="M80 225H25V675H62" class="edge"/><text x="43" y="630" font-size="22" direction="rtl" fill="#172554"><tspan x="43" dy="0" direction="rtl" unicode-bidi="isolate">لا</tspan></text><rect x="65" y="645" width="230" height="78" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="677" font-size="22" direction="rtl" fill="#172554"><tspan x="180" dy="0" direction="rtl" unicode-bidi="isolate">اطبع sum</tspan><tspan x="180" dy="28" direction="rtl" unicode-bidi="isolate">وانتهِ</tspan></text>
