<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Withdrawal: accept or reject</title><desc id="desc">One decision has connected acceptance and rejection paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<style>text{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.link{fill:none;stroke-width:3}</style>
<rect width="360" height="600" rx="12" fill="#f8fafc"/>
<rect x="55" y="15" width="250" height="65" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="180" y="42" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Balance: 200</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">No fees</tspan></text><path d="M180 80V110" class="edge"/><rect x="40" y="115" width="280" height="165" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="150" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Is the amount:</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">a positive integer,</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">a multiple of 50,</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">within the balance?</tspan></text><path d="M180 280V345" class="edge"/><text x="211" y="320" font-size="22" direction="ltr" fill="#172554"><tspan x="211" dy="0" direction="ltr" unicode-bidi="isolate">Yes</tspan></text><rect x="40" y="350" width="280" height="75" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="180" y="380" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Accept withdrawal</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">Deduct once</tspan></text><path d="M320 198H343V533H322" class="edge"/><text x="319" y="488" font-size="22" direction="ltr" fill="#172554"><tspan x="319" dy="0" direction="ltr" unicode-bidi="isolate">No</tspan></text><rect x="40" y="500" width="280" height="75" rx="10" fill="#fee2e2" stroke="#64748b" stroke-width="1.5"/><text x="180" y="530" font-size="22" direction="ltr" fill="#172554"><tspan x="180" dy="0" direction="ltr" unicode-bidi="isolate">Reject withdrawal</tspan><tspan x="180" dy="28" direction="ltr" unicode-bidi="isolate">Keep the balance</tspan></text>
</svg>
