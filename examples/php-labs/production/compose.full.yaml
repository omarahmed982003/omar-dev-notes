services:
  php:
    environment:
      APP_ENV: production
      DATABASE_URL: pgsql:host=postgres;port=5432;dbname=app
      DATABASE_USER: app
      DATABASE_PASSWORD: lesson-only-password
      REDIS_HOST: redis
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: php-runtime-lab
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: lesson-only-password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 2s
      retries: 20

  queue-worker:
    build:
      context: ..
      dockerfile: production/Dockerfile
    command: ["php", "/srv/app/bin/queue-worker.php"]
    environment:
      REDIS_HOST: redis
      WORKER_MAX_JOBS: "20"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
