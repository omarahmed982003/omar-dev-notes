services:
  php:
    build:
      context: ..
      dockerfile: production/Dockerfile
    environment:
      APP_ENV: production
    expose:
      - "9000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /usr/local/var/run:uid=82,gid=82,mode=0755
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 9000); exit($$s === false ? 1 : 0);"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/srv/app/public:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
